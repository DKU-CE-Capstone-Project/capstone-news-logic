[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-news-logic"
version = "0.1.0"
description = "Shared GDELT search and news body extraction for EconMind"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
extractors = ["beautifulsoup4>=4.12", "lxml>=5", "trafilatura>=1.12"]

[tool.setuptools.packages.find]
include = ["capstone_news_logic*", "diffbot*", "tavily_api*", "jina_reader*", "currents_news_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
